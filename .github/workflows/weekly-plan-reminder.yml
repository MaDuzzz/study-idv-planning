name: Weekly Plan Reminder (Tối Chủ Nhật 20h-21h)

on:
  schedule:
    # 🌿 NHẮC LÊN KẾ HOẠCH TUẦN MỚI (Tối Chủ nhật hàng tuần):
    # Kích hoạt lúc 13:30 UTC Chủ nhật (tương đương 20:30 tối Chủ nhật giờ Việt Nam ICT UTC+7).
    - cron: '30 13 * * 0'

  # Cho phép bấm nút "Run workflow" thủ công trên GitHub Actions bất kỳ lúc nào để test
  workflow_dispatch:
    inputs:
      shift:
        description: 'Phiên gửi email'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - auto

jobs:
  send-weekly-reminder:
    name: Gửi email nhắc kế hoạch tuần mới
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cài đặt thư viện Node.js
        run: |
          cd scripts/reminder
          npm install

      - name: 🚀 Chạy script gửi email nhắc kế hoạch tuần mới
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_URL: ${{ vars.APP_URL || 'https://maduzzz.github.io/study-idv-planning/' }}
          REMINDER_SHIFT: ${{ github.event.inputs.shift || 'weekly' }}
        run: |
          cd scripts/reminder
          node send-reminder.js
