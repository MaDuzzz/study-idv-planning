name: Nightly Task Reminder (Web Push to iPhone 23h30)

on:
  # Kích hoạt tức thì đúng từng giây bởi cron-job.org qua GitHub API
  workflow_dispatch:

  # Lịch dự phòng nếu cron-job.org gặp sự cố (16:30 UTC = 23:30 giờ VN)
  schedule:
    - cron: '30 16 * * *'

jobs:
  send-nightly-push:
    name: Bắn thông báo Web Push tới iPhone (23h30)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cài đặt thư viện Node.js
        run: |
          cd scripts/reminder
          npm install

      - name: 🚀 Bắn thông báo Web Push nhắc nhở cuối ngày
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:admin@study-planner.app' }}
          PUSH_ENCRYPTION_KEY: ${{ secrets.PUSH_ENCRYPTION_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://maduzzz.github.io/study-idv-planning/' }}
        run: |
          cd scripts/reminder
          node send-push-reminder.js
