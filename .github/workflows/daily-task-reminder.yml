name: Daily Task Reminder (7h Sáng & 18h Tối)

on:
  schedule:
    # 🌅 CA SÁNG: Mục tiêu nhận mail lúc ~07:00 AM giờ Việt Nam (UTC+7).
    # Vì hàng đợi GitHub Actions bị hoãn (delay) trung bình ~5 tiếng 25 phút,
    # đặt lịch kích hoạt lúc 18:40 UTC (tức 01:40 AM VN) -> sau delay sẽ chạy vào khoảng ~07:05 AM VN.
    - cron: '40 18 * * *'

    # 🌙 CA TỐI: Mục tiêu nhận mail lúc ~18:00 PM giờ Việt Nam (UTC+7).
    # Đặt lịch kích hoạt lúc 05:30 UTC (tức 12:30 PM VN) -> sau delay ~5 tiếng 35 phút sẽ chạy vào khoảng ~18:05 PM VN.
    - cron: '30 5 * * *'

  # Cho phép bấm nút "Run workflow" thủ công trên GitHub Actions bất kỳ lúc nào để test
  workflow_dispatch:
    inputs:
      shift:
        description: 'Chọn phiên gửi email nhắc việc'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

jobs:
  send-reminder:
    name: Gửi email nhắc việc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cài đặt thư viện Node.js
        run: |
          cd scripts/reminder
          npm install

      - name: 🚀 Chạy script gửi email nhắc việc
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_URL: ${{ vars.APP_URL || 'https://maduzzz.github.io/study-idv-planning/' }}
          REMINDER_SHIFT: ${{ github.event.inputs.shift || 'auto' }}
        run: |
          cd scripts/reminder
          node send-reminder.js
