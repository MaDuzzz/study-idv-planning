name: Daily Task Reminder (7h Sáng & 18h Tối)

on:
  schedule:
    # 🧪 MỐC TEST TỐI NAY: 20:25 & 20:30 Vietnam (UTC+7) -> 13:25 & 13:30 UTC
    - cron: '25 13 * * *'
    - cron: '30 13 * * *'
    # Lịch cố định hàng ngày
    # 7:05 AM Vietnam Time (UTC+7) -> 00:05 UTC (Lệch 5 phút tránh nghẽn hàng đợi phút 00 của GitHub)
    - cron: '5 0 * * *'
    # 18:05 (6:05 PM) Vietnam Time (UTC+7) -> 11:05 UTC (Lệch 5 phút tránh nghẽn hàng đợi phút 00 của GitHub)
    - cron: '5 11 * * *'

  # Cho phép bấm nút "Run workflow" thủ công trên GitHub Actions bất kỳ lúc nào để test
  workflow_dispatch:
    inputs:
      shift:
        description: 'Chọn phiên gửi email nhắc việc'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening

jobs:
  send-reminder:
    name: Gửi email nhắc việc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cài đặt thư viện Node.js
        run: |
          cd scripts/reminder
          npm install

      - name: 🚀 Chạy script gửi email nhắc việc
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          APP_URL: ${{ vars.APP_URL || 'https://maduzzz.github.io/study-idv-planning/' }}
          REMINDER_SHIFT: ${{ github.event.inputs.shift || 'auto' }}
        run: |
          cd scripts/reminder
          node send-reminder.js
