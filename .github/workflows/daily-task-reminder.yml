name: Daily Task Reminder (Ca Sáng 06:30 & Ca Tối 18:00 qua cron-job.org)

on:
  # Kích hoạt tức thì đúng từng giây bởi cron-job.org qua GitHub API (workflow_dispatch)
  workflow_dispatch:
    inputs:
      shift:
        description: 'Chọn phiên gửi email nhắc việc (morning / evening / weekly / auto)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
          - weekly

jobs:
  send-reminder:
    name: Gửi email nhắc việc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cài đặt thư viện Node.js
        run: |
          cd scripts/reminder
          npm install

      - name: 🚀 Chạy script gửi email nhắc việc
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_URL: ${{ vars.APP_URL || 'https://maduzzz.github.io/study-idv-planning/' }}
          REMINDER_SHIFT: ${{ github.event.inputs.shift || 'auto' }}
        run: |
          cd scripts/reminder
          node send-reminder.js
