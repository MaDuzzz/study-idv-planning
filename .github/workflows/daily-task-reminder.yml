name: Daily Task Reminder (Sáng & Tối)

on:
  schedule:
    # 🌅 CA SÁNG: Kích hoạt lúc 18:40 UTC (01:40 AM VN) -> sau delay hàng đợi GitHub Actions (~4.5h - 5h) nhận mail loanh quanh ~06:00 - 06:30 AM VN.
    - cron: '40 18 * * *'

    # 🌙 CA TỐI: Kích hoạt lúc 05:30 UTC (12:30 PM VN) -> sau delay hàng đợi (~5.5h) nhận mail loanh quanh ~18:00 - 18:05 PM VN.
    - cron: '30 5 * * *'

  # Cho phép bấm nút "Run workflow" thủ công trên GitHub Actions bất kỳ lúc nào để test
  workflow_dispatch:
    inputs:
      shift:
        description: 'Chọn phiên gửi email nhắc việc'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
          - weekly

jobs:
  send-reminder:
    name: Gửi email nhắc việc
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout mã nguồn
        uses: actions/checkout@v4

      - name: ⚙️ Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cài đặt thư viện Node.js
        run: |
          cd scripts/reminder
          npm install

      - name: 🚀 Chạy script gửi email nhắc việc
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_URL: ${{ vars.APP_URL || 'https://maduzzz.github.io/study-idv-planning/' }}
          REMINDER_SHIFT: ${{ github.event.inputs.shift || 'auto' }}
        run: |
          cd scripts/reminder
          node send-reminder.js
